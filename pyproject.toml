[project]
name = "bvd-action-jev"
version = "0.1.0"
description = "Fast VideoJev choice inference with a BVD action adapter"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "av==18.1.0",
    "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0%2Bcu12torch2.8cxx11abiTRUE-cp312-cp312-linux_aarch64.whl",
    "fastapi==0.162.3",
    "fla-core==0.4.2",
    "flash-linear-attention==0.4.2",
    "gradio==6.31.0",
    "huggingface-hub==1.33.0",
    "numpy==2.5.4",
    "pillow==12.3.0",
    "safetensors==0.8.0",
    "torch==2.8.0+cu129",
    "torchvision==0.23.0",
    "transformers==5.14.1",
    "uvicorn==0.54.0",
]

[project.scripts]
bvd-jev = "bvd_jev.cli:main"
bvd-jev-ui = "bvd_jev.serve:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_batch", "bvd_jev"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12'"]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
