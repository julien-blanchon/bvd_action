<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">VideoJev inference paths</title>
  <desc id="desc">A video is decoded, sampled, and encoded once. The fast batch path scores one question across many clips. The native joint path scores several questions about one clip using a shared video prefix. Both return candidate scores without generating answer tokens.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#55657d"/></marker>
    <style>
      .bg{fill:#f8fafc}.input{fill:#fff;stroke:#bac9d8;stroke-width:1.5}.core{fill:#eaf1ff;stroke:#7d9dcc;stroke-width:1.5}.fast{fill:#eaf4ff;stroke:#78a2ce;stroke-width:1.5}.joint{fill:#f1f5e9;stroke:#96ad7c;stroke-width:1.5}.out{fill:#fff;stroke:#bac9d8;stroke-width:1.5}.line{stroke:#55657d;stroke-width:2;fill:none;marker-end:url(#arrow)}.stem{stroke:#55657d;stroke-width:2;fill:none}.title{font:600 20px system-ui,sans-serif;fill:#1b2b43}.label{font:600 16px system-ui,sans-serif;fill:#1b2b43}.small{font:13px system-ui,sans-serif;fill:#53647a}
    </style>
  </defs>
  <rect class="bg" width="1200" height="390" rx="18"/>
  <text class="title" x="30" y="40">One video representation, direct choice scores</text>
  <rect class="input" x="30" y="120" width="180" height="100" rx="12"/>
  <text class="label" x="48" y="155">Video input</text>
  <text class="small" x="48" y="180">MP4 · BVD TAR</text>
  <text class="small" x="48" y="201">RGB tensor</text>
  <rect class="input" x="250" y="120" width="180" height="100" rx="12"/>
  <text class="label" x="268" y="155">Prepare frames</text>
  <text class="small" x="268" y="180">Decode · sample</text>
  <text class="small" x="268" y="201">Bounded CPU queue</text>
  <rect class="core" x="470" y="120" width="195" height="100" rx="12"/>
  <text class="label" x="488" y="155">Vision encode</text>
  <text class="small" x="488" y="180">Features shared</text>
  <text class="small" x="488" y="201">across questions</text>
  <path class="line" d="M210 170 H248"/><path class="line" d="M430 170 H468"/>
  <path class="stem" d="M665 170 H704 V111"/><path class="stem" d="M704 170 V246"/>
  <rect class="fast" x="745" y="70" width="235" height="82" rx="12"/>
  <text class="label" x="763" y="102">Fast batch path</text>
  <text class="small" x="763" y="127">One question × many clips</text>
  <rect class="joint" x="745" y="205" width="235" height="82" rx="12"/>
  <text class="label" x="763" y="237">Native joint path</text>
  <text class="small" x="763" y="262">Many questions × one clip</text>
  <path class="line" d="M704 111 H743"/><path class="line" d="M704 246 H743"/>
  <rect class="out" x="1020" y="70" width="150" height="82" rx="12"/>
  <text class="label" x="1038" y="102">Action label</text>
  <text class="small" x="1038" y="127">BVD adapter</text>
  <rect class="out" x="1020" y="205" width="150" height="82" rx="12"/>
  <text class="label" x="1038" y="237">Choice scores</text>
  <text class="small" x="1038" y="262">Action · tool · scene</text>
  <path class="line" d="M980 111 H1018"/><path class="line" d="M980 246 H1018"/>
  <text class="small" x="30" y="352">Both paths avoid answer-token generation. Joint questions share video work; each added question still adds text and scoring compute.</text>
</svg>
